<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Forever Builders · ADU</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font:17px/1.4 Heebo,system-ui,sans-serif;color:#fff;background:#0b0b0c url(../_assets/site/wide-black-marble-bg.webp) center/cover;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3svh,32px);padding:16px;height:100svh;text-align:center}
.logo{width:clamp(80px,12svh,120px)}
h1{margin:0;font-weight:800;font-size:clamp(26px,4.6svh,44px);line-height:1.1}
h1 small{display:block;font-weight:500;font-size:.5em;color:#DCAF5E;letter-spacing:.06em;margin-top:6px}
.pick{display:flex;gap:clamp(14px,3vw,40px);justify-content:center;align-items:center}
.v{display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;text-decoration:none}
.c{display:block;width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;border:3px solid #DCAF5E;box-shadow:0 18px 40px -18px #000;transition:transform .2s}
.c img{width:100%;height:100%;object-fit:cover;object-position:50% 6%;display:block}
.v b{font-size:clamp(22px,3.4svh,30px);font-weight:800;color:#FFD07B}
.v:hover .c,.v:focus-visible .c{transform:scale(1.05)}
:root{--d:min(240px,26vw,30svh)}
@media (max-width:640px){
  .pick{flex-direction:column;gap:clamp(10px,2svh,20px)}
  .v{flex-direction:row;gap:18px}
  :root{--d:min(170px,20svh)}
}
</style>
</head>
<body>
  <img class="logo" src="../_assets/logo.png" alt="Forever Builders">
  <h1>דף נחיתה ADU<small>קמפיין 1</small></h1>
  <div class="pick">
    <a class="v" href="a/?pick=1"><span class="c"><img src="shots/1-adu-a-mob-hero.jpg" alt="גרסה 1"></span><b>1</b></a>
    <a class="v" href="b/?pick=1"><span class="c"><img src="shots/1-adu-b-mob-hero.jpg" alt="גרסה 2"></span><b>2</b></a>
    <a class="v" href="c/?pick=1"><span class="c"><img src="shots/1-adu-c-mob-hero.jpg" alt="גרסה 3"></span><b>3</b></a>
  </div>
</body>
</html>
